<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>走到大昭寺</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#FCFBF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="true">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Ma+Shan+Zheng&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#FCFBF7; --dot:#E3E2D9; --ink:#1E2A33; --ink2:#62717C; --ink3:#9BA6AE;
    --rule:#DCDDD6; --red:#C0392F; --redsoft:rgba(192,57,47,.26); --earth:rgba(30,42,51,.05);
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --num:"Caveat","PingFang SC",cursive;
    --brush:"Ma Shan Zheng","PingFang SC",cursive;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#14171A; --dot:#262C31; --ink:#EAE8E2; --ink2:#95A0A8; --ink3:#5F6970;
      --rule:#282E33; --red:#E06A5B; --redsoft:rgba(224,106,91,.28); --earth:rgba(234,232,226,.045);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#14171A; --dot:#262C31; --ink:#EAE8E2; --ink2:#95A0A8; --ink3:#5F6970;
    --rule:#282E33; --red:#E06A5B; --redsoft:rgba(224,106,91,.28); --earth:rgba(234,232,226,.045);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    position:relative;
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);
    background-size:21px 21px;background-position:-1px -1px;
    color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
    padding:14px 18px 44px;max-width:600px;margin:0 auto;-webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .ic{width:1em;height:1em;flex:none}
  .doodle{position:absolute;color:var(--ink3);opacity:.55;pointer-events:none;z-index:0}
  #clip{top:-6px;left:4px;width:32px;transform:rotate(-11deg)}
  #stupa{bottom:4px;left:50%;margin-left:-21px;width:42px;opacity:.42}
  #rose{bottom:6px;left:4px;width:40px;opacity:.3;transform:rotate(-7deg)}

  .topbar{display:flex;justify-content:flex-end;padding-bottom:2px;position:relative;z-index:1}
  #theme{background:none;border:0;cursor:pointer;padding:5px;color:var(--ink2);display:flex;line-height:0}
  #theme svg{width:19px;height:19px}

  /* 区块标题 */
  .sec{position:relative;margin-top:30px}
  .vig{display:block;height:auto;overflow:visible;color:var(--ink2);opacity:.66;margin:14px 0 0}
  #vig1{width:186px} #vig2{width:170px} #vig3{width:190px}
  .brush{display:block;color:var(--ink);opacity:.52;flex:none;overflow:visible;pointer-events:none}
  #br0{position:absolute;left:212px;top:1px;width:54px;height:27px;opacity:.38}
  .sqrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  #br1{width:64px;height:31px;margin-right:5%}
  .gaprow{display:flex;align-items:center;gap:10px;margin-top:14px}
  .gaprow .vig{margin:0}
  .gaprow.l{padding-left:3%}
  .gaprow.l .margin{margin-left:auto}
  .gaprow.r{padding-right:2%}
  .gaprow.r .vig{margin-left:auto}
  .gaprow.c{justify-content:space-between;padding:0 2%}
  .margin{font-family:var(--brush);font-size:14.5px;line-height:1.35;color:var(--ink3);
    transform:rotate(-4deg);flex:none;letter-spacing:.04em;pointer-events:none}
  .margin.m2{transform:rotate(3deg)}
  #br2{width:48px;height:41px}
  #br3{width:44px;height:39px;transform:rotate(-8deg)}
  #br4{width:46px;height:36px}
  #br5{width:38px;height:26px;margin-left:auto}
  .ring{width:64px;height:58px;color:var(--ink2);opacity:.22;flex:none;overflow:visible}
  @media (max-width:400px){#vig1,#vig2,#vig3{width:150px}.margin{font-size:13px}#br0{left:198px}}
  .panel.torn{border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;padding-bottom:20px}
  .panel.torn::after{border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .tear{position:absolute;left:-1.5px;bottom:-6px;width:calc(100% + 3px);height:12px;color:var(--rule);overflow:visible}
  #plane{width:150px;height:auto;overflow:visible;color:var(--ink3);opacity:.75;margin:2px auto 0 46px}
  #pack{position:absolute;right:2px;bottom:-10px;width:34px;color:var(--ink3);opacity:.7;pointer-events:none}
  #pot{width:46px;height:auto;margin-left:4px;color:var(--ink3);opacity:.7;flex:none}
  .sec:first-of-type{margin-top:6px}
  .sechd{display:flex;align-items:center;gap:9px;position:relative;padding-bottom:3px}
  .sechd .ic{font-size:21px;color:var(--ink2);position:relative;z-index:1}
  .sechd h2{font-family:var(--brush);font-size:27px;font-weight:400;letter-spacing:.05em;
    line-height:1.2;position:relative;z-index:1}
  .sechd .crest{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
  .sechd .crest svg{width:27px;height:25px;display:block;color:var(--ink2);opacity:.85}
  .sechd .crest span{position:relative;line-height:0}
  .sechd .dd{margin-left:auto;color:var(--ink3);opacity:.7;flex:none;line-height:0}
  .sechd .dd svg{width:34px;height:30px;display:block}
  .sechd .ct{margin-left:auto;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .wave{display:block;width:100%;height:9px;overflow:visible;color:var(--rule)}

  /* 进度 */
  .total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-top:14px}
  .total .big{font-family:var(--num);font-size:126px;font-weight:700;line-height:.74;letter-spacing:.005em}
  .total .unit{font-family:var(--brush);font-size:34px;color:var(--ink2);line-height:1;letter-spacing:.04em}
  .total .pct{font-family:var(--num);font-size:26px;color:var(--red);margin-left:auto;line-height:1}
  .squig{display:block;width:210px;max-width:64%;height:12px;overflow:visible;color:var(--ink3);margin:2px 0 0 2px}
  .bar{margin:16px 0 0}
  .bar svg{display:block;width:100%;height:auto;overflow:visible}
  .here{font-size:13.5px;color:var(--ink2);padding:10px 1px 0}
  .here b{color:var(--red);font-weight:600}

  /* 面板 */
  .panel{position:relative;border:1.5px solid var(--rule);
    border-radius:17px 6px 15px 7px/7px 16px 6px 17px;padding:15px 15px 16px;margin-top:12px}
  .panel::after{content:"";position:absolute;inset:-5px -3px -3px -5px;pointer-events:none;
    border:1.1px solid var(--rule);opacity:.5;
    border-radius:7px 16px 6px 17px/17px 6px 15px 7px;transform:rotate(-.22deg)}
  .panel.dash{border-style:dashed}

  .entry{display:flex;gap:8px}
  .entry input{flex:1;min-width:0;background:transparent;color:var(--ink);font:inherit;
    font-variant-numeric:tabular-nums;padding:12px 14px;
    border:1.6px solid var(--ink);border-radius:15px 5px 13px 6px/6px 14px 5px 15px}
  .entry input::placeholder{color:var(--ink3)}
  .entry button{background:var(--ink);color:var(--paper);font-family:var(--brush);font-size:19px;
    padding:0 24px;cursor:pointer;letter-spacing:.06em;
    border:1.6px solid var(--ink);border-radius:6px 15px 5px 13px/14px 6px 15px 5px}
  .entry button:active{background:var(--red);border-color:var(--red)}
  .noteline{display:flex;align-items:center;gap:8px;padding-top:12px;color:var(--ink3)}
  .noteline input{flex:1;background:transparent;border:0;border-bottom:1.4px dashed var(--rule);
    color:var(--ink);font:inherit;font-size:13.5px;padding:5px 2px 7px}
  .noteline input::placeholder{color:var(--ink3)}
  .noteline input:focus{outline:0;border-bottom-color:var(--red)}
  .more{background:none;border:0;color:var(--ink3);font:inherit;font-size:12.5px;cursor:pointer;
    padding:10px 2px 0;display:block}
  .more-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px}
  .more-box[hidden]{display:none}
  .more-box label{display:flex;align-items:baseline;gap:4px;font-size:12.5px;color:var(--ink3)}
  .more-box input,.bd-more input,.bd-more select,.row.editing select{background:transparent;border:0;
    border-bottom:1.4px dashed var(--rule);color:var(--ink);font:inherit;font-size:13.5px;
    padding:4px 2px 5px;width:62px;font-variant-numeric:tabular-nums}
  .more-box input:focus{outline:0;border-bottom-color:var(--red)}
  .rpe{display:flex;gap:6px;margin-left:auto}
  .rpe button{background:none;border:1.2px solid var(--rule);color:var(--ink2);font:inherit;font-size:12.5px;
    padding:4px 10px;cursor:pointer;border-radius:10px 4px 9px 5px/5px 9px 4px 10px}
  .rpe button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--rule)}
  .hint{font-size:12px;color:var(--red);padding:10px 2px 0;min-height:17px}
  .hint.ok{color:var(--ink2)}

  /* 风景 */
  .scene{margin:6px -6px 0}
  #chart{display:block;width:100%;height:auto;overflow:visible;cursor:pointer}
  .detail{margin:14px 0 0;padding:13px 15px 15px;
    border:1.6px solid var(--ink);border-radius:5px 16px 6px 14px/15px 5px 14px 6px}
  .detail .hd{display:flex;align-items:baseline;gap:9px;padding-bottom:2px}
  .detail .hd b{font-family:var(--brush);font-size:21px;font-weight:400;letter-spacing:.04em}
  .detail .hd span{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .detail .nav{margin-left:auto;display:flex;gap:1px;flex:none}
  .detail .nav button{background:none;border:0;color:var(--ink2);font:inherit;font-size:17px;
    line-height:1;cursor:pointer;padding:3px 7px}
  .detail .nav button:disabled{color:var(--ink3);opacity:.45;cursor:default}
  .detail .story{padding-top:11px;margin-top:10px;border-top:1px dashed var(--rule);
    font-size:13.5px;line-height:1.75;color:var(--ink2)}

  /* 抽屉 */
  .drawers{margin-top:30px}
  details{margin-bottom:6px}
  summary{display:flex;align-items:center;gap:9px;padding:11px 3px;cursor:pointer;
    font-family:var(--brush);font-size:23px;letter-spacing:.05em;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary .ic{font-size:20px;color:var(--ink2)}
  summary .ct{margin-left:auto;font-family:var(--sans);font-size:12.5px;color:var(--ink2);
    font-variant-numeric:tabular-nums}
  summary .cv{color:var(--ink3);font-size:10px;transition:transform .18s;flex:none;font-family:var(--sans)}
  details[open] summary .cv{transform:rotate(90deg)}

  .logtop{padding-bottom:12px;border-bottom:1px dashed var(--rule)}
  .wk{font-size:13px;color:var(--ink2)}
  .wk b{font-family:var(--num);font-size:21px;color:var(--ink);font-weight:700}
  .left{font-size:13px;color:var(--ink2);padding-top:2px}
  .left b{color:var(--ink);font-weight:600}

  /* 数据格 */
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 10px;text-align:center}
  .grid dd .sub{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink2);padding-top:3px}
  .grid .ic{font-size:19px;color:var(--ink2);margin:0 auto 5px;display:block}
  .grid dt{font-size:11.5px;color:var(--ink2);padding-bottom:2px}
  .grid dd{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
  .grid dd small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink2);padding-left:3px}
  .grid dd.soft{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--ink2);line-height:1.5}
  @media (max-width:380px){.grid{grid-template-columns:1fr 1fr}}
  @media (max-width:400px){.sechd .crest{gap:3px}.sechd .crest svg{width:22px;height:21px}}
  .bars{display:flex;align-items:flex-end;gap:5px;height:48px;padding-top:22px}
  .bars i{flex:1;min-height:2px;background:var(--rule);border-radius:2px 2px 0 0}
  .bars i.cur{background:var(--red)}
  .barsLab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding-top:5px}

  .stop .ad{font-family:var(--num);font-size:17px;color:var(--red);opacity:.8;line-height:1}
  .stop{display:grid;grid-template-columns:13px 1fr auto auto;align-items:center;gap:11px;
    width:100%;padding:9px 0;border:0;border-bottom:1px dashed var(--rule);
    background:none;text-align:left;color:inherit;font-family:inherit;font-size:14px;cursor:pointer}
  .stop:last-child{border-bottom:0}
  .stop .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3);margin-left:2px}
  .stop.done .dot{background:var(--red);border-color:var(--red)}
  .stop.now .dot{box-shadow:0 0 0 3.5px var(--redsoft)}
  .stop .nm{color:var(--ink3)}
  .stop.done .nm{color:var(--ink)}
  .stop small{color:var(--ink2);font-size:11.5px;padding-left:6px}
  .stop.now small{color:var(--red)}
  .stop .km{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}

  .bg{display:flex;flex-direction:column;gap:9px}
  .bgi{cursor:pointer;padding:11px 66px 12px 14px;display:flex;align-items:baseline;gap:11px;
    border:1.5px solid var(--red);border-radius:14px 5px 15px 6px/5px 14px 6px 15px}
  .bgi b{font-family:var(--brush);font-size:25px;font-weight:400;color:var(--red);flex:none;
    line-height:1;letter-spacing:.04em}
  .bgi span{font-size:12.5px;color:var(--ink2);line-height:1.45}
  .bgi .k{margin-left:auto;font-size:11.5px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
  .bgi{position:relative;padding-right:66px}
  .stamp{position:absolute;width:54px;height:54px;color:var(--red);opacity:.82;pointer-events:none}
  .bgi .stamp{right:6px;top:50%;margin-top:-27px}
  .card{position:relative}
  .card .stamp{right:14px;top:12px;width:64px;height:64px}
  .detail .sci{font-size:12px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums}

  .row{display:flex;align-items:baseline;gap:12px;padding:9px 0;
    border-bottom:1px dashed var(--rule);font-size:14px;flex-wrap:wrap}
  .row .d{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
  .row .k{margin-left:auto;font-variant-numeric:tabular-nums}
  .row .nt{width:100%;font-size:12.5px;color:var(--ink2);padding-left:2px;line-height:1.45}
  .row button{background:none;border:0;color:var(--ink3);font:inherit;font-size:12px;
    cursor:pointer;padding:0 2px 0 6px}
  .row button:hover{color:var(--red)}
  .empty{color:var(--ink2);font-size:13.5px;padding:12px 2px}

  /* 补记（记录抽屉最下方） */
  .backfill{margin-top:14px;padding-top:13px;border-top:1px dashed var(--rule)}
  #bdToggle{background:none;border:0;color:var(--ink2);font:inherit;font-size:12.5px;cursor:pointer;
    padding:2px 0;text-decoration:underline;text-underline-offset:3px;display:flex;align-items:center;gap:6px}
  #bdToggle .ic{font-size:14px}
  #bdForm{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:11px}
  #bdForm input{background:transparent;border:1.2px solid var(--rule);color:var(--ink);font:inherit;
    font-size:13px;padding:8px 10px;border-radius:9px 4px 8px 5px/5px 8px 4px 9px;min-width:0}
  #bdForm #bdNote{grid-column:1/-1}
  #bdForm .bd-more{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--ink3)}
  #bdForm .bd-more input,#bdForm .bd-more select{border:1.2px solid var(--rule);border-radius:8px 3px 7px 4px/4px 7px 3px 8px;
    padding:6px 8px;width:auto;min-width:0;flex:1}
  #bdForm button{grid-column:1/-1;background:none;border:1.4px solid var(--ink);color:var(--ink);
    font-family:var(--brush);font-size:17px;padding:8px;cursor:pointer;letter-spacing:.06em;
    border-radius:5px 12px 6px 11px/11px 6px 12px 5px}
  #bdForm[hidden]{display:none}

  /* 备份提醒 */
  #backup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;padding:9px 13px;
    font-size:12.5px;color:var(--ink2);border:1.4px dashed var(--red);
    border-radius:13px 5px 12px 6px/6px 12px 5px 13px}
  #backup[hidden]{display:none}
  #backup b{color:var(--red);font-weight:600}
  #backup button{background:none;border:0;font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0;
    text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
  #backup button.later{color:var(--ink3);margin-left:auto}
  /* 底部浮条：撤销、确认 */
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    z-index:2147482000;background:var(--ink);color:var(--paper);font-size:13.5px;
    display:flex;align-items:center;gap:14px;padding:11px 16px;max-width:calc(100% - 32px);
    border-radius:14px 5px 13px 6px/6px 13px 5px 14px;animation:rise .22s ease-out}
  .toast button{background:none;border:0;color:var(--paper);font:inherit;font-weight:700;cursor:pointer;
    padding:2px 0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  @keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  /* 编辑一条记录 */
  .row.editing{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:11px 0}
  .row.editing input{background:transparent;border:1.2px solid var(--rule);color:var(--ink);font:inherit;
    font-size:13px;padding:7px 9px;border-radius:9px 4px 8px 5px/5px 8px 4px 9px;min-width:0}
  .row.editing .en{grid-column:1/-1}
  .row.editing .emore{grid-column:1/-1;display:flex;gap:8px}
  .row.editing .emore input,.row.editing .emore select{flex:1;min-width:0;width:auto;
    border:1.2px solid var(--rule);border-radius:9px 4px 8px 5px/5px 8px 4px 9px;padding:7px 9px;font-size:13px}
  .row .dt{width:100%;font-size:11.5px;color:var(--ink3);padding-left:2px;font-variant-numeric:tabular-nums}
  .row.editing .acts{grid-column:1/-1;display:flex;gap:16px;justify-content:flex-end}
  .row.editing .acts button{font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
  .row.editing .acts .sv{color:var(--red);font-weight:600}
  /* 点阵日历 */
  .pace{margin-top:24px}
  .pace svg{display:block;width:100%;height:auto;overflow:visible}
  .pace[hidden]{display:none}
  .cal{margin-top:22px}
  .cal svg{display:block;width:100%;height:auto;overflow:visible}
  .cal .cap{font-size:11px;color:var(--ink3);padding-top:6px;display:flex;justify-content:space-between}
  footer{padding-top:26px;font-size:12.5px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    position:relative}
  footer button{background:none;border:0;color:var(--ink3);font:inherit;font-size:12.5px;
    cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
  footer #reset.arm{color:var(--red)}
  #err{width:100%;color:var(--red);font-size:11.5px;padding-top:3px}
  #err:empty{display:none}

  .veil{position:fixed;inset:0;background:rgba(18,22,26,.6);display:flex;
    align-items:center;justify-content:center;padding:24px;z-index:2147483000}
  .card{background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:21px 21px;
    padding:24px 24px 20px;max-width:330px;width:100%;
    border:2px solid var(--red);border-radius:19px 7px 17px 8px/8px 18px 7px 19px;
    animation:pop .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes pop{from{opacity:0;transform:scale(.94) rotate(-.7deg)}to{opacity:1;transform:none}}
  .card h3{font-family:var(--brush);font-size:46px;font-weight:400;color:var(--red);line-height:1.05;
    padding-bottom:8px;letter-spacing:.04em}
  .card .place{font-size:12.5px;color:var(--ink2);padding-bottom:12px;font-variant-numeric:tabular-nums}
  .card p{font-size:13.5px;line-height:1.6;padding-bottom:20px}
  .card .acts{display:flex;gap:8px}
  .card .acts button{flex:1;font:inherit;font-size:13.5px;padding:10px;cursor:pointer}
  .card #shareBtn{background:none;border:1.5px solid var(--ink);color:var(--ink);
    border-radius:12px 5px 11px 6px/6px 12px 5px 12px}
  .card #closeBtn{background:var(--red);border:1.5px solid var(--red);color:#fff;font-weight:600;
    border-radius:5px 12px 6px 11px/12px 6px 12px 5px}
  .copied{font-size:12px;color:var(--ink2);padding-top:10px;text-align:center;word-break:break-all}
</style>
</head>

<div class="topbar"><svg class="brush" id="br0" viewBox="0 0 60 30" aria-hidden="true"></svg><svg id="plane" viewBox="0 0 162 34" aria-hidden="true"></svg><button id="theme" aria-label="切换深浅色"></button></div>

<div id="backup" hidden><span id="backupTxt"></span><button id="backupGo">导出 CSV</button><button class="later" id="backupLater">过几天再说</button></div>
<section class="sec">
  <div class="sechd"><span class="ic" id="icTrip"></span><h2>旅途进度</h2><span class="crest" id="crest"></span></div>
  <svg class="wave" viewBox="0 0 600 9" preserveAspectRatio="none" aria-hidden="true"><path id="wv1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>

  <div class="total"><span class="big" id="totalKm">0</span><span class="unit">公里</span><span class="pct" id="pct"></span></div>
  <div class="sqrow"><svg class="squig" viewBox="0 0 210 12" preserveAspectRatio="none" aria-hidden="true"><path id="sq1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><svg class="brush" id="br1" viewBox="0 0 70 34" aria-hidden="true"></svg></div>

  <div class="bar"><svg id="barSvg" viewBox="0 0 600 88" aria-hidden="true"></svg></div>
  <div class="here" id="here">读取记录中…</div>
  <svg id="pack" viewBox="0 0 38 42" aria-hidden="true"></svg>
</section>

<div class="gaprow l"><svg class="vig" id="vig1" viewBox="0 0 176 64" aria-hidden="true"></svg><span class="margin">路在脚下，<br>山在心上。</span><svg class="brush" id="br2" viewBox="0 0 56 48" aria-hidden="true"></svg></div>
<section class="sec">
  <div class="sechd"><span class="ic" id="icPen"></span><h2>记一笔</h2><span class="dd" data-dd="shoe"></span></div>
  <svg class="wave" viewBox="0 0 600 9" preserveAspectRatio="none" aria-hidden="true"><path id="wv2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  <div class="panel dash torn">
    <div class="entry">
      <input id="km" type="number" inputmode="decimal" step="0.1" min="0" placeholder="今天走了多少公里">
      <button id="add">记一笔</button>
    </div>
    <div class="noteline"><span class="ic" id="icNote"></span><input id="note" type="text" maxlength="80" placeholder="备注"></div>
    <button class="more" id="moreToggle">+ 时长 · 坡度 · 感受</button>
    <div class="more-box" id="moreBox" hidden>
      <label><input id="mMin" type="number" inputmode="numeric" min="0" step="1" placeholder="时长"><span>分钟</span></label>
      <label><input id="mInc" type="number" inputmode="decimal" min="0" max="15" step="0.5" placeholder="坡度"><span>%</span></label>
      <div class="rpe" id="mRpe"><button data-r="1" aria-pressed="false">轻松</button><button data-r="2" aria-pressed="false">正好</button><button data-r="3" aria-pressed="false">吃力</button></div>
    </div>
    <div class="hint" id="hint"></div>
    <svg class="tear" viewBox="0 0 600 12" preserveAspectRatio="none" aria-hidden="true"><path id="tearP" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
</section>

<div class="gaprow r"><svg class="ring" id="ring" viewBox="0 0 70 64" aria-hidden="true"></svg><svg class="brush" id="br3" viewBox="0 0 50 44" aria-hidden="true"></svg><svg class="vig" id="vig2" viewBox="0 0 170 52" aria-hidden="true"></svg></div>
<section class="sec">
  <div class="sechd"><span class="ic" id="icMt"></span><h2>海拔剖面</h2><span class="dd" data-dd="cloud"></span></div>
  <svg class="wave" viewBox="0 0 600 9" preserveAspectRatio="none" aria-hidden="true"><path id="wv3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  <div class="scene">
    <svg id="chart" viewBox="0 0 800 330" role="img" aria-label="沿途地形与当前位置">
      <defs><clipPath id="walked"><rect id="clipRect" x="-20" y="-60" width="0" height="460"/></clipPath>
      <clipPath id="earthClip"><path id="earthClipPath"/></clipPath></defs>
      <path id="earth" fill="var(--earth)" stroke="none"/>
      <g id="hatchG" clip-path="url(#earthClip)" stroke="var(--ink)" stroke-width=".85"
         stroke-linecap="round" fill="none" opacity=".17"></g>
      <path id="props" fill="none" stroke="var(--ink)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="river" fill="none" stroke="var(--ink3)" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
      <g id="extras"></g>
      <g id="flags"></g>
      <path id="lineA" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="lineB" fill="none" stroke="var(--ink)" stroke-width="1" stroke-linecap="round" opacity=".38"/>
      <path id="lineR" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#walked)"/>
      <g id="nodes"></g>
      <path id="walker" fill="none" stroke="var(--red)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="sky" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"></g>
    </svg>
  </div>
  <div id="detail"></div>
</section>

<div class="gaprow c"><span class="margin m2">慢慢走，<br>比较快。</span><svg class="vig" id="vig3" viewBox="0 0 196 60" aria-hidden="true"></svg><svg class="brush" id="br4" viewBox="0 0 52 40" aria-hidden="true"></svg></div>
<div class="drawers">
  <details>
    <summary><span class="cv">▶</span><span class="ic" id="icData"></span>数据</summary>
    <div class="panel">
      <dl class="grid">
        <div><span class="ic" data-ic="mount"></span><dt>当前海拔</dt><dd id="sAlt">—</dd></div>
        <div><span class="ic" data-ic="up"></span><dt>路线爬升</dt><dd id="sGain">—</dd></div>
        <div><span class="ic" data-ic="ramp"></span><dt>跑步机爬升</dt><dd id="sTm">—</dd></div>
        <div><span class="ic" data-ic="foot"></span><dt>每次平均</dt><dd id="sPer">—</dd></div>
        <div><span class="ic" data-ic="clock"></span><dt>近期配速</dt><dd id="sSpd">—</dd></div>
        <div><span class="ic" data-ic="cal"></span><dt>实际推进</dt><dd id="sPace">—</dd></div>
        <div><span class="ic" data-ic="post"></span><dt>下一站</dt><dd id="sNext">—</dd></div>
        <div><span class="ic" data-ic="flag"></span><dt>预计抵达</dt><dd id="sEta">—</dd></div>
        <div><span class="ic" data-ic="book"></span><dt>记录</dt><dd id="sCnt">—</dd></div>
      </dl>
      <div class="bars" id="bars"></div>
      <div class="barsLab"><span>8 周前</span><span>本周</span></div>
      <div class="pace" id="paceBox" hidden><svg id="paceSvg" viewBox="0 0 284 96" aria-label="配速"></svg></div>
      <div class="cal"><svg id="calSvg" viewBox="0 0 284 120" aria-label="最近二十周"></svg></div>
    </div>
  </details>

  <details>
    <summary><span class="cv">▶</span><span class="ic" id="icPost"></span>沿途站点<span class="ct" id="ctStops"></span></summary>
    <div class="panel" id="stops"></div>
  </details>

  <details>
    <summary><span class="cv">▶</span><span class="ic" id="icSeal"></span>徽章<span class="ct" id="ctBadges"></span></summary>
    <div class="panel"><div class="bg" id="badges"></div></div>
  </details>

  <details>
    <summary><span class="cv">▶</span><span class="ic" id="icBook"></span>记录<span class="ct" id="ctLog"></span></summary>
    <div class="panel">
      <div class="logtop"><div class="wk" id="wk"></div><div class="left" id="leftTxt"></div></div>
      <div id="entries"></div>
      <div class="backfill">
        <button id="bdToggle"><span class="ic" data-ic="cal"></span><span id="bdLabel">补记其他日期</span></button>
        <div id="bdForm" hidden>
          <input id="bdDate" type="date" aria-label="日期">
          <input id="bdKm" type="number" inputmode="decimal" step="0.1" min="0" placeholder="公里" aria-label="公里">
          <input id="bdNote" type="text" maxlength="80" placeholder="备注" aria-label="备注">
          <div class="bd-more">
            <input id="bdMin" type="number" inputmode="numeric" min="0" step="1" placeholder="时长 分钟" aria-label="时长">
            <input id="bdInc" type="number" inputmode="decimal" min="0" max="15" step="0.5" placeholder="坡度 %" aria-label="坡度">
            <select id="bdRpe" aria-label="感受"><option value="">感受</option><option value="1">轻松</option><option value="2">正好</option><option value="3">吃力</option></select>
          </div>
          <button id="bdAdd">补记这一笔</button>
        </div>
      </div>
    </div>
  </details>
</div>

<footer>
  <button id="csv">导出 CSV</button>
  <button id="imp">导入 CSV</button>
  <button id="reset">清空全部记录</button>
  <svg class="brush" id="br5" viewBox="0 0 44 30" aria-hidden="true"></svg>
  <svg id="pot" viewBox="0 0 54 58" aria-hidden="true"></svg>
  <input id="file" type="file" accept=".csv,text/csv" hidden>
  <div id="err"></div>
</footer>

<script>
const ROUTE=[
 {km:0,alt:50,lon:114.26,name:'家',story:'《道德经》第六十四章："合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。"',note:'起点',prop:'house'},
 {km:120,alt:20,lon:113.26,name:'广州',story:'广府早茶讲"一盅两件"：一盅茶，两件点心。清末的二厘馆最早只收二厘钱，供脚夫和小贩天不亮吃完再开工。这套吃法传了一百多年没变。',badge:'一盅两件',flavor:'天光未白，茶楼已是一片人声。叹一盅，食两件——一百二十里，这样起步刚好。'},
 {km:710,alt:150,lon:110.29,name:'桂林',story:'这些孤峰是三亿多年前的海底。石灰岩被雨水和地下水溶蚀了千万年，才剩下柱子一样的山。"喀斯特"一词来自斯洛文尼亚的一片石头高地，原意就是"荒石地"。',badge:'漓江倒影',flavor:'韩愈写此地"江作青罗带，山如碧玉篸"。七百里走来，你也走进了这幅画。',prop:'karst'},
 {km:1280,alt:1070,lon:106.71,name:'贵阳',story:'贵州阴雨多、产盐少，苗侗人家把米汤和菜装坛自然发酵，酸味代替了咸味。当地话说："三天不吃酸，走路打蹿蹿。"',badge:'酸汤',flavor:'天无三日晴，地无三尺平。一碗酸汤暖了身，从这里起，路一寸寸往天上去。'},
 {km:2130,alt:500,lon:104.07,name:'成都',story:'杜甫在成都草堂住了四年，写下"窗含西岭千秋雪，门泊东吴万里船"。西岭就在城西，晴天从成都城里真能望见雪山。',note:'G318 上路',badge:'零公里',flavor:'花重锦官城。川藏公路的零公里就在城南，平原到此为止，往西每一步都是上坡。',prop:'city'},
 {km:2280,alt:620,lon:103.04,name:'雅安',story:'雅安一年下两百多天雨，因为横断山把暖湿气流堵在了这里。唐代起它就是川藏茶马古道的起点，背夫背着上百斤茶砖翻二郎山，用丁字拐撑着歇脚，石板上至今有拐窝。',badge:'雅雨',flavor:'人称天漏，一年两百多天雨。茶马古道的背夫从这里负茶入藏，你接着他们走。'},
 {km:2480,alt:2560,lon:101.96,name:'康定',story:'康定旧称打箭炉，是汉藏两边商人换茶和马的锅庄集市。《康定情歌》原是当地的"溜溜调"，1940 年代才被记谱唱到外面去。',badge:'溜溜的城',flavor:'跑马山下，折多河穿城而过。汉藏在此交汇，你站在了高原的门槛上。'},
 {km:2510,alt:4298,lon:101.8,name:'折多山口',story:'"折多"在藏语里有弯曲的意思。当地人说"翻过折多山，才算进了西藏"——它同时是地理的分界和语言、习俗的分界。',badge:'4298',flavor:'"翻过折多山，才算到西藏。"一千七百多米的爬升，你一步也没少。',prop:'mani'},
 {km:2555,alt:3460,lon:101.49,name:'新都桥',story:'高原空气里水汽少，光几乎不打折地落到地上，明暗对比极强。摄影的人叫它"光影走廊"，其实是三千五百米海拔给的。',badge:'光影走廊',flavor:'十里白杨，一川草甸，光落得又轻又透。走累了，在这儿多站一会儿。'},
 {km:2630,alt:2600,lon:101.01,name:'雅江',story:'松茸只长在活的松树根上，菌丝和树根共生，至今无法人工栽培。一朵要长五六年，采的时候必须留住菌丝，明年这窝才还有。',badge:'雅砻江',flavor:'松茸伏在云杉根下，江声在谷底低回。你与雅砻江同行一程。'},
 {km:2765,alt:4014,lon:100.27,name:'理塘',story:'六世达赖仓央嘉措写过："洁白的仙鹤，请把双翅借我，不往远处去飞，只到理塘就回。"后人认为这四句预示了他的转世之地。',badge:'世界高城',flavor:'仓央嘉措说"不往远处去飞，只到理塘就回"。海拔四千，你也到了。'},
 {km:2930,alt:2580,lon:99.11,name:'巴塘',story:'巴塘弦子是用牛角胡伴奏的圆圈舞，男子持琴领舞，女子随后接唱，一支曲子可以跳到天亮。2006 年列入第一批国家级非物质文化遗产。',badge:'弦子',flavor:'金沙江畔，弦子一响，圆圈能转到天明。川藏的界线，被你轻轻跨过。'},
 {km:3035,alt:3870,lon:98.59,name:'芒康',story:'盐井的古盐田在澜沧江边，晒了一千三百多年。卤水背上木架晒台，靠日晒风干。江西岸出白盐，东岸出红盐——同一条江，两岸土质不同。',note:'进入西藏',badge:'盐井',flavor:'江边盐田晒了一千三百年，西岸白，东岸红。从这一步起，脚下是西藏。'},
 {km:3190,alt:3780,lon:97.84,name:'左贡',story:'玉曲是怒江的支流。藏语里"曲"就是河，"措"是湖。高原上凡带"曲"字的地名，几乎都在水边。',badge:'玉曲',flavor:'玉曲河谷又长又静。最磨人的往往是这种不起眼的路，你没有停。'},
 {km:3290,alt:4120,lon:97.26,name:'邦达',story:'邦达草原海拔四千三，属高寒草甸。这里的草一年只长几厘米，牦牛啃掉的一口，要长好几个月才补得回来。',badge:'邦达草原',flavor:'天高风冷，草不过寸。最平的一段，也最考人的耐性。'},
 {km:3390,alt:3260,lon:96.92,name:'八宿',story:'怒江在这一带切出的峡谷深逾两千米。七十二拐就修在谷壁上，从垭口一路盘到江边。这道峡谷是印度板块撞上欧亚板块挤出来的，现在每年还在抬升。',badge:'七十二拐',flavor:'怒江七十二拐，一拐一重天。骑车的人在这里推车，你一口气走进了峡谷。'},
 {km:3480,alt:3960,lon:96.77,name:'然乌',story:'然乌湖是两百多年前山体滑坡堵住河谷形成的堰塞湖。湖水那种蓝绿色来自冰川磨碎岩石产生的极细颗粒，悬在水中把光散开，叫"冰川乳"。',badge:'然乌湖',flavor:'冰川化水，山崩成湖，湖面静得照得见雪峰。停一停，看一眼。'},
 {km:3610,alt:2750,lon:95.77,name:'波密',story:'米堆冰川的末端只到海拔两千四，是中国位置最低的冰川之一。印度洋的暖湿气流沿雅鲁藏布大峡谷一路北上，在这里卸下大雪，冰川才能压到这么低。',badge:'米堆冰川',flavor:'冰川垂到桃花林边，是藏东最温柔的地方。海拔降下来了，缓一口气。'},
 {km:3700,alt:1800,lon:95.07,name:'通麦',story:'帕隆藏布在这里切穿山体，两岸都是松动的堆积体。老川藏线的通麦天险塌方不断，有"通麦坟场"之称，2016 年隧道和大桥通车后才成了旧事。',badge:'通麦天险',flavor:'帕隆藏布在脚下奔涌。昔日最险的一段，如今只是你身后的一句往事。',prop:'trees'},
 {km:3760,alt:3300,lon:94.73,name:'鲁朗',story:'"鲁朗"藏语意为龙王谷。石锅鸡用的石锅是墨脱产的皂石凿的，只能靠人背出来，一口几十斤，越用越滑，据说能炖出别处炖不出的味道。',badge:'石锅鸡',flavor:'鲁朗林海，云杉如墨。一千五百米爬回来，这锅石锅鸡是犒劳。'},
 {km:3840,alt:3000,lon:94.36,name:'林芝',story:'南迦巴瓦海拔 7782 米，常年裹在云里，被叫作"羞女峰"。雅鲁藏布江绕它脚下拐出一个马蹄形大弯，切出了世界最深的峡谷。',badge:'南迦巴瓦',flavor:'南迦巴瓦终年隐在云后，十人来九人不得见。见与不见，你都已走到它脚下。'},

/* ---------- 路线 ---------- */
function altAt(km){
  if(km<=0)return ROUTE[0].alt;
  for(let i=1;i<ROUTE.length;i++) if(km<=ROUTE[i].km){
    const a=ROUTE[i-1],b=ROUTE[i];
    return a.alt+(b.alt-a.alt)*(km-a.km)/(b.km-a.km);
  }
  return ROUTE[ROUTE.length-1].alt;
}
function gainAt(km){
  let g=0;
  for(let i=0;i<ROUTE.length-1;i++){
    const a=ROUTE[i],b=ROUTE[i+1];
    if(km<=a.km)break;
    const d=b.alt-a.alt;
    if(d>0)g+=d*Math.min(1,(km-a.km)/(b.km-a.km));
  }
  return g;
}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

/* ---------- 笔迹 ---------- */
function seeded(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pen(pts,seed,amp){
  const r=seeded(seed),out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    const steps=Math.max(1,Math.min(6,Math.round(len/26)));
    for(let s=0;s<steps;s++){
      const t=s/steps,j=(r()-.5)*2*amp;
      out.push([a[0]+dx*t+nx*j,a[1]+dy*t+ny*j]);
    }
  }
  const L=pts[pts.length-1];
  out.push([L[0]+(r()-.5)*amp,L[1]+(r()-.5)*amp]);
  return 'M'+out.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
}
function penCircle(cx,cy,rad,seed){
  const r=seeded(seed),n=14,st=r()*6.283,span=6.85;
  let d='';
  for(let i=0;i<=n;i++){
    const a=st+i/n*span,rr=rad*(1+(r()-.5)*.2);
    d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1);
  }
  return d;
}
function snake(x,y,len,seed,amp,vert){
  const r=seeded(seed),pts=[];let a=vert?1.5708:0;
  let px=x,py=y;
  const step=len/14;
  for(let i=0;i<=14;i++){
    pts.push([px,py]);
    a+=(r()-.5)*1.5;                     // 每一段随便拐一点，像蛇爬过
    px+=Math.cos(a)*step;py+=Math.sin(a)*step*(amp||1);
  }
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
    d+=`Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  return d;
}
function spiral(cx,cy,r,turns,seed){
  const rd=seeded(seed),pts=[],n=turns*18;
  for(let i=0;i<=n;i++){const t=i/n,a=t*turns*6.283,rr=r*(1-t*.92)*(.95+rd()*.1);
    pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}
  return 'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
}

    const dx=2*u*(p1[0]-p0[0])+2*t*(p2[0]-p1[0]),dy=2*u*(p1[1]-p0[1])+2*t*(p2[1]-p1[1]);

    else if(kind==='na')w=maxW*(t<.78?Math.pow(t/.78,.85):Math.max(.04,(1-t)/.22));

/* ---------- 进度条：素描斜纹 + 奔跑的人 ---------- */
function capsule(x,y,w,h,seed){
  const r=h/2,pts=[];
  for(let i=0;i<=8;i++){const a=Math.PI*1.5+i/8*Math.PI;pts.push([x+w-r+Math.cos(a)*r,y+r+Math.sin(a)*r])}
  pts.unshift([x+r,y]);pts.push([x+r,y+h]);
  for(let i=0;i<=8;i++){const a=Math.PI*.5+i/8*Math.PI;pts.push([x+r+Math.cos(a)*r,y+r+Math.sin(a)*r])}
  return pen(pts,seed,.9);
}
function runner(x,base,k){
  const t=base-2;  // 脚踩在条子上沿
  return penCircle(x+1.5,t-19,3.1,k)+' '+
    pen([[x+1.6,t-15.8],[x-1.2,t-8]],k+1,.6)+' '+
    pen([[x+1,t-14],[x+7.5,t-16.5]],k+2,.6)+' '+
    pen([[x+1,t-13.4],[x-5.6,t-11]],k+3,.6)+' '+
    pen([[x-1.2,t-8],[x+5.4,t-2],[x+6.4,t]],k+4,.6)+' '+
    pen([[x-1.2,t-8],[x-7.4,t-5],[x-9.6,t]],k+5,.6);
}
function drawBar(frac){
  const BX=6,BW=588,BY=30,BH=27,y2=BY+BH;
  const outline=capsule(BX,BY,BW,BH,881);
  const fw=Math.max(0,BW*frac);
  let s=`<defs><clipPath id="capClip"><path d="${outline}"/></clipPath>`+
        `<clipPath id="fillClip"><rect x="${BX-1}" y="${BY-3}" width="${(fw+1).toFixed(1)}" height="${BH+6}"/></clipPath></defs>`;
  if(fw>3){
    // 手画的斜排短线：粗细和间距都不齐
    let h='';const r=seeded(4242);
    for(let x=BX-BH;x<BX+fw;x+=9){
      const w=(1.8+r()*1.3).toFixed(1),o=(r()-.5)*1.7;
      h+=`<path d="${pen([[x+o,y2+2],[x+BH+o,BY-2]],900+Math.round(x),.7)}" stroke="var(--ink)" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
    }
    s+=`<g clip-path="url(#capClip)"><g clip-path="url(#fillClip)">${h}</g></g>`;
    s+=`<path d="${pen([[BX+fw,BY+1],[BX+fw,y2-1]],777,.8)}" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
  }
  s+=`<path d="${outline}" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`;
  const Lg=leg(total());
  ROUTE.filter(p=>p.km>=Lg.a&&p.km<=Lg.b).forEach(p=>{const x=BX+BW*((p.km-Lg.a)/(Lg.b-Lg.a));
    s+=`<path d="M${x.toFixed(1)} ${y2+5}v${p.prop?7:4}" stroke="var(--ink3)" stroke-width="1.1" stroke-linecap="round"/>`});
  const rx=Math.min(BX+BW-10,Math.max(BX+10,BX+fw));
  if(fw>26){
    s+=`<path d="${pen([[rx-20,BY-16],[rx-12,BY-16]],620,.6)} ${pen([[rx-24,BY-10],[rx-14,BY-10]],621,.6)}"`+
       ` fill="none" stroke="var(--ink3)" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  s+=`<path d="${runner(rx,BY,610)}" fill="none" stroke="var(--red)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=`<text x="${BX}" y="${y2+24}" fill="var(--ink3)" font-size="12">${Lg.from}</text>`;
  s+=`<text x="${BX+BW}" y="${y2+24}" fill="var(--ink3)" font-size="12" text-anchor="end">${Lg.to}</text>`;
  $('barSvg').innerHTML=s;
}

/* ---------- 坡度 ---------- */
function renderDetail(){
  const box=$('detail');

  const p=ROUTE[sel];
  box.innerHTML=`<div class="detail"><div class="hd"><b>${esc(p.name)}</b>

      <button id="nx"${!ROUTE[sel+1]||!inLeg(ROUTE[sel+1])?' disabled':''} aria-label="下一个点">\u203a</button>
      <button id="cl" aria-label="关闭">\u00d7</button>
    </div></div>
    <div class="sci">${sci(p)}</div>
    ${p.story?`<div class="story">${esc(p.story)}</div>`:''}</div>`;
  if($('pv'))$('pv').onclick=()=>select(sel-1);
  if($('nx'))$('nx').onclick=()=>select(sel+1);
  $('cl').onclick=()=>select(null);
}
function select(i,scroll){
  sel=(i===null||i<0||i>=ROUTE.length||!inLeg(ROUTE[i]))?null:i;
  drawScene(Math.min(total(),FULL));renderDetail();
  if(scroll&&sel!==null&&$('chart').scrollIntoView)$('chart').scrollIntoView({behavior:'smooth',block:'center'});
}
$('chart').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const km=Xinv((e.clientX-r.left)/r.width*W);
  let best=-1,bd=Infinity;
  ROUTE.forEach((p,i)=>{if(!inLeg(p))return;const d=Math.abs(p.km-km);if(best<0||d<bd){bd=d;best=i}});
  select(best);
});
document.addEventListener('keydown',e=>{
  if(sel===null||/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'&&ROUTE[sel-1]&&inLeg(ROUTE[sel-1])){e.preventDefault();select(sel-1)}
  if(e.key==='ArrowRight'&&ROUTE[sel+1]&&inLeg(ROUTE[sel+1])){e.preventDefault();select(sel+1)}
  if(e.key==='Escape')select(null);
});

/* ---------- 渲染 ---------- */
function render(){
  const t=total(),cap=Math.min(t,FULL),Lg=leg(t),frac=Math.min(1,Math.max(0,(t-Lg.a)/(Lg.b-Lg.a)));
  $('totalKm').textContent=t%1?t.toFixed(1):fmt(t);
  $('pct').textContent=(Lg.a?'第二程 ':'')+(frac*100).toFixed(1)+'%';
  drawBar(frac);
  paintCrest(cap);
  drawScene(cap);

  let passed=ROUTE[0],next=null;
  for(const p of ROUTE){if(cap>=p.km)passed=p;else{next=p;break}}
  const PC=pace(),ok=PC.n>=4&&PC.span>=10&&PC.perDay>0,nd=next&&ok?dateAfter(next.km-cap,PC.perDay):null;
  $('here').innerHTML=next?`刚过 <b>${esc(passed.name)}</b> · 距 ${esc(next.name)} 还有 ${fmt(next.km-cap)} 公里`+(nd?` · 约 ${md(nd)} 到`:'')
    :`<b>转山一圈，圆满。</b>`;
  const rem=Lg.b-t;
  $('leftTxt').innerHTML=rem>0?`距${Lg.to}还有 <b>${fmt(rem)}</b> 公里 · 这一程完成 ${(frac*100).toFixed(1)}%`
    :`全部走完，多出 <b>${fmt(t-FULL)}</b> 公里`;

  const ws=weekStart(new Date()).getTime();
  const thisWk=state.entries.filter(e=>parse(e.date).getTime()>=ws).reduce((s,e)=>s+e.km,0);
  const lastWk=state.entries.filter(e=>{const d=parse(e.date).getTime();return d>=ws-7*DAY&&d<ws}).reduce((s,e)=>s+e.km,0);

  const n=state.entries.length,days=PC.span;

  $('sAlt').innerHTML=fmt(altAt(cap))+'<small>m</small>';
  $('sGain').innerHTML=fmt(gainAt(cap))+'<small>m</small>';
  $('sTm').innerHTML=tmUp?fmt(tmUp)+'<small>m</small>':'—';
  $('sPer').innerHTML=n?(t/n).toFixed(1)+'<small>km</small>':'—';
  $('sSpd').innerHTML=rKm?paceStr(rMin,rKm)+'<small>/km</small>':'—';
  $('sPace').innerHTML=n?(PC.perDay*7).toFixed(1)+'<small>km/周</small>':'—';
  $('sCnt').innerHTML=n?`${n}<small>次 / ${days}天</small>`:'—';
  const nx=$('sNext');
  if(next&&nd){nx.className='';nx.innerHTML=`${md(nd)}<span class="sub">${esc(next.name)}</span>`}
  else if(next){nx.className='soft';nx.textContent=next.name}
  else{nx.className='';nx.textContent='—'}
  const eta=$('sEta'),ed=ok&&n>=6&&days>=21&&rem>0?dateAfter(rem,PC.perDay):null;
  if(ed){eta.className='';eta.innerHTML=`${ed.getFullYear()}.${String(ed.getMonth()+1).padStart(2,'0')}<span class="sub">${Lg.to}</span>`}
  else if(rem<=0){eta.className='';eta.textContent='已抵达'}
  else{eta.className='soft';eta.textContent='还需更多记录'}

  $('bars').innerHTML=Array.from({length:8},(_,i)=>{
    const s=ws-(7-i)*7*DAY;
    return state.entries.filter(e=>{const d=parse(e.date).getTime();return d>=s&&d<s+7*DAY}).reduce((a,e)=>a+e.km,0);
  }).map((v,i,arr)=>{
    const mx=Math.max(...arr,1);
    return `<i class="${i===7?'cur':''}" style="height:${Math.max(2,v/mx*100)}%" title="${v.toFixed(1)} km"></i>`;
  }).join('');

  drawCal();drawPace();
  const ARR=arrivals();
  const shown=ROUTE.filter(p=>p.km<=L1||t>=L1);

  $('stops').innerHTML=ROUTE.map((p,i)=>{

    :'<div class="empty" style="padding:0 2px">还没有徽章。</div>';

  $('ctLog').textContent=n?`${n} 次`:'';

        <input class="einc" type="number" inputmode="decimal" min="0" max="15" step="0.5" value="${e.inc!=null?e.inc:''}" placeholder="坡度 %" aria-label="坡度">
        <select class="erpe" aria-label="感受">${RPE.map((t,i)=>`<option value="${i||''}"${(e.rpe||0)===i?' selected':''}>${i?t:'感受'}</option>`).join('')}</select>
      </div>
      <div class="acts"><button class="cn">取消</button><button class="sv">保存</button></div></div>`
    :`<div class="row">
      <span class="d">${e.date.slice(5).replace('-','.')}</span>

      ${e.note?`<span class="nt">${esc(e.note)}</span>`:''}

/* ---------- 徽章 ---------- */
let QUEUE=[];
function checkBadges(){
  const t=Math.min(total(),FULL),ack=state.ack;
  const got=ROUTE.filter(p=>p.badge&&p.km>ack&&p.km<=t);
  state.ack=t;
  const j=got.findIndex(p=>p.km===L1);
  if(j>=0)got.splice(j+1,0,UNLOCK);        // 走到大昭寺，紧接着告诉你第二程
  if(!got.length)return null;
  QUEUE=got.slice(1);              // 一次跨过好几个站就一个个弹
  return got[0];
}
function popup(p){
  const tt=total(),Lp=leg(tt),rem=Lp.b-tt;
  const txt=`我在跑步机上走到了${p.name}「${p.badge}」，距家 ${fmt(p.km)} 公里。${rem>0?`还剩 ${fmt(rem)} 公里到${Lp.to}。`:'全部走完了。'}`;
  const v=document.createElement('div');
  v.className='veil';
  v.innerHTML=`<div class="card" role="dialog" aria-modal="true">
    ${stamp((arrivals()[p.km]||iso(new Date())),p.km,p.km%97+11)}
    <h3>${esc(p.badge)}</h3>
    <div class="place">${esc(p.place||`${p.name} · ${fmt(p.km)} km · 海拔 ${fmt(p.alt)} m`)}</div>
    <p>${esc(p.flavor)}</p>
    <div class="acts"><button id="shareBtn">分享</button><button id="closeBtn">继续</button></div>
    <div class="copied" id="copied"></div></div>`;
  (document.documentElement||document.body).appendChild(v);
  document.body.style.overflow='hidden';
  const close=()=>{v.remove();document.body.style.overflow='';if(QUEUE.length)popup(QUEUE.shift())};
  v.querySelector('#closeBtn').onclick=close;
  v.addEventListener('click',e=>{if(e.target===v)close()});
  v.querySelector('#shareBtn').onclick=async()=>{
    try{
      if(navigator.share){await navigator.share({text:txt});return}
      await navigator.clipboard.writeText(txt);
      $('copied').textContent='已复制到剪贴板';
    }catch(err){$('copied').textContent=txt}
  };
  v.querySelector('#closeBtn').focus();
}

/* ---------- 点阵日历：走了的日子是墨点，休息的日子就是纸 ---------- */
function drawCal(){
  const weeks=20,cell=14,ox=8,oy=22;
  const today=new Date();today.setHours(0,0,0,0);
  const start=weekStart(today);start.setDate(start.getDate()-(weeks-1)*7);
  const by={};state.entries.forEach(e=>{by[e.date]=(by[e.date]||0)+e.km});
  let s='',lastM=-1;
  for(let w=0;w<weeks;w++){
    const col=new Date(start);col.setDate(start.getDate()+w*7);
    if(col.getMonth()!==lastM){lastM=col.getMonth();
      s+=`<text x="${ox+w*cell-3}" y="9" font-size="9.5" fill="var(--ink3)">${col.getMonth()+1}月</text>`}
    for(let d=0;d<7;d++){
      const day=new Date(start);day.setDate(start.getDate()+w*7+d);
      if(day>today)continue;
      const k=iso(day),v=by[k]||0,cx=ox+w*cell,cy=oy+d*cell;
      if(v>0){const rr=2.1+Math.min(1,v/15)*3.5;
        s+=`<path d="${penCircle(cx,cy,rr,day.getTime()%9973)}" fill="var(--ink)" stroke="var(--ink)" stroke-width=".6"/>`}
      else s+=`<circle cx="${cx}" cy="${cy}" r="1.15" fill="var(--ink3)" opacity=".55"/>`;
      if(day.getTime()===today.getTime())
        s+=`<path d="${penCircle(cx,cy,6.6,77)}" fill="none" stroke="var(--red)" stroke-width="1.2" stroke-linecap="round"/>`;
    }
  }
  $('calSvg').innerHTML=s;
}

/* ---------- 速度、到站日期、科学 ---------- */
const mid=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
// 最近四周的速度（含休息日）；记录不满四周就用全部天数
function pace(){
  const n=state.entries.length;if(!n)return{perDay:0,span:0,n:0};
  const today=mid(Date.now()),first=parse(state.entries.map(e=>e.date).sort()[0]).getTime();
  const span=Math.max(1,Math.round((today-first)/DAY)+1),win=Math.min(28,span),since=today-(win-1)*DAY;
  const sum=state.entries.filter(e=>parse(e.date).getTime()>=since).reduce((a,e)=>a+e.km,0);
  return{perDay:sum/win,span,n,win};
}
function dateAfter(km,perDay){
  if(!(perDay>0)||km<=0)return null;
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+Math.ceil(km/perDay));return d;
}
const md=d=>`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;
// 每一站是哪天走到的：按日期把记录累加起来
function arrivals(){
  const rows=[...state.entries].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const out={};let c=0,i=0;
  for(const r of rows){c+=r.km;while(i<ROUTE.length&&ROUTE[i].km<=c+1e-9){out[ROUTE[i].km]=r.date;i++}}
  return out;
}
// 海拔和经度直接算出来的：气压、沸点、当地太阳正午
function sci(p){
  const ratio=Math.pow(1-2.25577e-5*p.alt,5.25588);
  const tb=1730.63/(8.07131-Math.log10(760*ratio))-233.426;
  const now=new Date(),N=Math.round((mid(now)-new Date(now.getFullYear(),0,0).getTime())/DAY);
  const B=2*Math.PI*(N-81)/364,eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  let t=Math.round(720+(120-(p.lon||120))*4-eot),hh=Math.floor(t/60),mm=t%60;
  return `气压是海边的 ${Math.round(ratio*100)}% · 水 ${Math.round(tb)}°C 就开 · 正午在北京时间 ${hh}:${String(mm).padStart(2,'0')}`;
}
function stamp(date,km,seed){
  const [y,m,d]=date.split('-'),rot=((seed*37)%21)-12;
  return `<svg class="stamp" viewBox="0 0 54 54" style="transform:rotate(${rot}deg)" aria-hidden="true">
    <path d="${penCircle(27,27,23,seed)}" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="${penCircle(27,27,18,seed+3)}" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="27" y="21" text-anchor="middle" font-size="6.5" fill="currentColor" letter-spacing=".5">${y}</text>
    <text x="27" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="Caveat,cursive">${+m}.${d}</text>
    <text x="27" y="41" text-anchor="middle" font-size="5.6" fill="currentColor">${fmt(km)} km</text></svg>`;
}
function drawPace(){
  const rows=[...state.entries].filter(e=>e.min>0&&e.km>0).sort((a,b)=>a.date<b.date?-1:1).slice(-30);
  const box=$('paceBox');
  if(rows.length<3){box.hidden=true;return}
  box.hidden=false;
  const ps=rows.map(r=>r.min/r.km),lo=Math.min(...ps),hi=Math.max(...ps),pad=Math.max(.3,(hi-lo)*.18);
  const y0=lo-pad,y1=hi+pad,W2=284,top=18,bot=84;
  const X2=i=>12+i*((W2-40)/Math.max(1,rows.length-1)),Y2=v=>top+(v-y0)/(y1-y0)*(bot-top);  // 越快越高
  const pts=rows.map((r,i)=>[X2(i),Y2(ps[i])]);
  let s=`<text x="2" y="9" font-size="9.5" fill="var(--ink3)">配速</text>`;
  s+=`<text x="${W2}" y="${Y2(lo)+3}" font-size="12" fill="var(--ink2)" text-anchor="end" font-family="Caveat,cursive">${paceStr(lo,1)}</text>`;
  s+=`<text x="${W2}" y="${Y2(hi)+3}" font-size="12" fill="var(--ink3)" text-anchor="end" font-family="Caveat,cursive">${paceStr(hi,1)}</text>`;
  s+=`<path d="${pen(pts,5151,.8)}" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  rows.forEach((r,i)=>{const[x,y]=pts[i];
    if(r.rpe===3)s+=`<path d="${penCircle(x,y,3.4,700+i)}" fill="var(--ink)" stroke="var(--ink)" stroke-width="1"/>`;
    else if(r.rpe===2)s+=`<path d="${penCircle(x,y,3.4,700+i)}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="1.2" fill="var(--ink)"/>`;
    else if(r.rpe===1)s+=`<path d="${penCircle(x,y,3.4,700+i)}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>`;
    else s+=`<circle cx="${x}" cy="${y}" r="1.6" fill="var(--ink2)"/>`;
  });
  $('paceSvg').innerHTML=s;
}

/* ---------- 记录的细节 ---------- */
const RPE=['','轻松','正好','吃力'];
function paceStr(min,km){
  if(!(min>0&&km>0))return '';
  let m=Math.floor(min/km),sec=Math.round((min/km-m)*60);if(sec===60){m++;sec=0}
  return `${m}'${String(sec).padStart(2,'0')}"`;
}
const num=v=>{const x=parseFloat(v);return x>0?x:undefined};
function extraFrom(min,inc,rpe){
  const o={};const a=num(min),b=parseFloat(inc),c=parseInt(rpe,10);
  if(a)o.min=Math.round(a);
  if(b>=0&&inc!==''&&inc!=null&&!isNaN(b))o.inc=Math.round(b*10)/10;
  if(c>=1&&c<=3)o.rpe=c;
  return o;
}
function detailLine(e){
  const bits=[];
  if(e.min)bits.push(`${e.min} 分钟`);
  if(e.inc!=null)bits.push(`坡度 ${e.inc}%`);
  if(e.rpe)bits.push(RPE[e.rpe]);
  if(e.min)bits.push(`配速 ${paceStr(e.min,e.km)}`);
  return bits.join(' · ');
}

/* ---------- 底部浮条 ---------- */
let toastEl=null,toastT=null;
function toast(msg,label,act,ms){
  if(toastEl)toastEl.remove();clearTimeout(toastT);
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>`+(label?`<button>${esc(label)}</button>`:'');
  if(label)t.querySelector('button').onclick=()=>{t.remove();toastEl=null;act&&act()};
  (document.documentElement||document.body).appendChild(t);toastEl=t;
  toastT=setTimeout(()=>{if(toastEl===t){t.remove();toastEl=null}},ms||6000);
}

/* ---------- 备份提醒 ---------- */
const MKEY='g318:meta';
function meta(){try{return JSON.parse(localStorage.getItem(MKEY)||'{}')}catch(e){return{}}}
function setMeta(m){try{localStorage.setItem(MKEY,JSON.stringify(Object.assign(meta(),m)))}catch(e){}}
function checkBackup(){
  const box=$('backup'),n=state.entries.length;
  if(!n){box.hidden=true;return}
  const m=meta(),now=Date.now();
  if(m.snooze&&now<m.snooze){box.hidden=true;return}
  const first=parse(state.entries.map(e=>e.date).sort()[0]).getTime();
  const base=m.lastExport||first, days=Math.floor((now-base)/DAY);
  if(days<30){box.hidden=true;return}
  $('backupTxt').innerHTML=m.lastExport?`上次备份是 <b>${days}</b> 天前`:`记了 <b>${days}</b> 天，还没备份过`;
  box.hidden=false;
}

/* ---------- 交互 ---------- */
function guardBig(km,fire){
  if(km<=42){fire();return}
  toast(`${km.toFixed(1)} 公里？一次超过一个马拉松了`,'确认记下',fire,9000);
}
function addEntry(km,date,note,extra){
  state.entries=state.entries.concat([Object.assign({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date,km:Math.round(km*10)/10,note:(note||'').trim()||undefined},extra||{})]);
  if(extra&&extra.inc!=null)setMeta({lastInc:extra.inc});
  const earned=checkBadges();
  commit();if(earned)popup(earned);
  flash(`已记录 ${km.toFixed(1)} 公里 · 累计 ${fmt(total())}`);
}
$('add').addEventListener('click',()=>{
  const v=parseFloat($('km').value);
  if(!(v>0)){flash('输入一个公里数，比如 6.5',1);$('km').focus();return}
  const note=$('note').value;
  const ex=$('moreBox').hidden?{}:extraFrom($('mMin').value,$('mInc').value,rpeSel);
  guardBig(v,()=>{addEntry(v,iso(new Date()),note,ex);$('km').value='';$('note').value='';
    $('mMin').value='';setRpe(0)});
});
$('km').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
let rpeSel=0;
function setRpe(r){rpeSel=r;$('mRpe').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.r===r)))}
$('mRpe').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const r=+b.dataset.r;setRpe(rpeSel===r?0:r)});
function showMore(open){$('moreBox').hidden=!open;$('moreToggle').textContent=open?'− 收起':'+ 时长 · 坡度 · 感受'}
$('moreToggle').addEventListener('click',()=>{const open=$('moreBox').hidden;showMore(open);setMeta({moreOpen:open})});
$('note').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
$('bdToggle').addEventListener('click',()=>{
  const f=$('bdForm'),open=f.hidden;
  f.hidden=!open;
  $('bdLabel').textContent=open?'收起补记':'补记其他日期';
  if(open&&!$('bdDate').value)$('bdDate').value=iso(new Date());
});
$('bdAdd').addEventListener('click',()=>{
  const v=parseFloat($('bdKm').value),d=$('bdDate').value;
  if(!(v>0)||!d){flash('补记需要日期和公里数',1);return}
  const note=$('bdNote').value,ex=extraFrom($('bdMin').value,$('bdInc').value,$('bdRpe').value);
  guardBig(v,()=>{addEntry(v,d,note,ex);$('bdKm').value='';$('bdNote').value='';
    $('bdMin').value='';$('bdRpe').value=''});
});
let editingId=null;
$('entries').addEventListener('click',e=>{
  const t=e.target,ds=t.dataset||{};
  if(ds.del){
    const gone=state.entries.find(x=>x.id===ds.del),prevAck=state.ack;if(!gone)return;
    state.entries=state.entries.filter(x=>x.id!==ds.del);
    state.ack=Math.min(state.ack,Math.min(total(),FULL));
    commit();
    toast(`已删除 ${gone.date.slice(5).replace('-','.')} 的 ${gone.km} 公里`,'撤销',()=>{
      state.entries=state.entries.concat([gone]);state.ack=prevAck;commit();
    });
  }else if(ds.ed){editingId=ds.ed;render();
    const r=$('entries').querySelector('.editing .ek');if(r)r.focus();
  }else if(t.classList.contains('cn')){editingId=null;render();
  }else if(t.classList.contains('sv')){
    const row=t.closest('.editing'),v=parseFloat(row.querySelector('.ek').value),d=row.querySelector('.ed').value;
    if(!(v>0)||!d){toast('需要日期和公里数');return}
    const note=row.querySelector('.en').value.trim()||undefined;
    const ex=extraFrom(row.querySelector('.emin').value,row.querySelector('.einc').value,row.querySelector('.erpe').value);
    const apply=()=>{
      state.entries=state.entries.map(x=>x.id===editingId?Object.assign({id:x.id,date:d,km:Math.round(v*10)/10,note},ex):x);
      editingId=null;
      const earned=checkBadges();          // 改大了跨过站点也照样弹
      commit();if(earned)popup(earned);
    };
    guardBig(v,apply);
  }
});
$('badges').addEventListener('click',e=>{
  const b=e.target.closest('[data-bg]');if(!b)return;
  const p=ROUTE.find(x=>x.km===+b.dataset.bg);if(p)popup(p);
});
$('stops').addEventListener('click',e=>{
  const b=e.target.closest('.stop');if(!b)return;
  select(+b.dataset.i,true);
});

/* CSV 进出 */
const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
function toCSV(){
  const rows=[...state.entries].sort((a,b)=>a.date<b.date?-1:1);let c=0;
  return '\ufeff日期,公里,累计公里,备注,时长分钟,坡度,感受\n'+
    rows.map(r=>{c+=r.km;return `${r.date},${r.km},${c.toFixed(1)},${q(r.note)},${r.min||''},${r.inc!=null?r.inc:''},${r.rpe?RPE[r.rpe]:''}`}).join('\n')+'\n';
}
function parseCSV(txt){
  const out=[],lines=txt.replace(/^\ufeff/,'').split(/\r?\n/);
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];if(!ln.trim())continue;
    const f=[];let cur='',inq=false;
    for(let j=0;j<ln.length;j++){
      const ch=ln[j];
      if(inq){ if(ch==='"'){ if(ln[j+1]==='"'){cur+='"';j++} else inq=false } else cur+=ch }
      else if(ch==='"')inq=true;
      else if(ch===','){f.push(cur);cur=''}
      else cur+=ch;
    }
    f.push(cur);
    const date=(f[0]||'').trim(),km=parseFloat(f[1]);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!(km>0))continue;   // 表头和坏行自动跳过
    const rp=RPE.indexOf((f[6]||'').trim());
    out.push(Object.assign({date,km:Math.round(km*10)/10,note:(f[3]||'').trim()||undefined},
      extraFrom(f[4]||'',(f[5]||'').trim(),rp>0?rp:'')));
  }
  return out;
}
$('csv').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([toCSV()],{type:'text/csv;charset=utf-8'}));
  a.download='g318-'+iso(new Date())+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  setMeta({lastExport:Date.now(),snooze:0});checkBackup();
});
$('imp').addEventListener('click',()=>$('file').click());
$('backupGo').addEventListener('click',()=>$('csv').click());
$('backupLater').addEventListener('click',()=>{setMeta({snooze:Date.now()+7*DAY});checkBackup()});
$('file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let rows=[];
    try{rows=parseCSV(String(rd.result))}catch(err){flash('这个文件读不出来',1);return}
    if(!rows.length){flash('没读到有效记录（需要 日期,公里 两列）',1);return}
    // 同一天记了两次一样的公里数是合法的：按出现次数比，不按"有没有"比
    const key=x=>x.date+'|'+x.km+'|'+(x.note||'');
    const have={};state.entries.forEach(x=>{have[key(x)]=(have[key(x)]||0)+1});
    const add=[];
    rows.forEach(r=>{const k=key(r);if(have[k]>0)have[k]--;else add.push(Object.assign({
      id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)},r))});
    state.entries=state.entries.concat(add);
    state.ack=Math.min(total(),FULL);
    commit();
    flash(`导入 ${add.length} 条，跳过重复 ${rows.length-add.length} 条`);
  };
  rd.readAsText(f);e.target.value='';
});
$('reset').addEventListener('click',()=>{
  if(!armed){armed=true;$('reset').textContent='再点一次，全部清空';$('reset').classList.add('arm');
    setTimeout(()=>{armed=false;$('reset').textContent='清空全部记录';$('reset').classList.remove('arm')},4000);return}
  armed=false;$('reset').textContent='清空全部记录';$('reset').classList.remove('arm');
  state={entries:[],ack:0};commit();
});

paintIcons();
$('wv1').setAttribute('d',wavePath(600,9,11,21));
$('wv2').setAttribute('d',doubleRule(22));
$('wv3').setAttribute('d',trailRule(23));

let savedTheme=null;try{savedTheme=localStorage.getItem(TKEY)}catch(e){}
applyTheme(savedTheme);
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  if(!document.documentElement.dataset.theme)applyTheme(null);

loadLocal();render();ready=true;checkBackup();
{const m=meta();if(m.moreOpen)showMore(true);if(m.lastInc!=null){$('mInc').value=m.lastInc;$('bdInc').value=m.lastInc}}
try{if(navigator.storage&&navigator.storage.persist)
  navigator.storage.persisted().then(ok=>{if(!ok)navigator.storage.persist()}).catch(()=>{})}catch(e){}
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
